<body>
  <div id="controls" style="display: none;">

  <!-- Logo will be dynamically created by the Logo component -->

  <script type="module">
    // Global cleanup function to remove any existing buttons before app loads
    function globalButtonCleanup() {
      console.log('🧹 Pre-app cleanup: Removing all latest gig buttons...');
      const allButtons = document.querySelectorAll('.latest-gig-button');
      console.log(`🗑️ Found ${allButtons.length} buttons to remove before app load`);
      
      allButtons.forEach((button, index) => {
        console.log(`🗑️ Pre-removing button ${index + 1}:`, button);
        if (button.parentNode) {
          button.parentNode.removeChild(button);
        }
      });
      
      // Clear any global references
      if (window.omnivoidApp) {
        window.omnivoidApp.latestGigButton = null;
      }
      
      const remainingButtons = document.querySelectorAll('.latest-gig-button');
      console.log(`✅ Pre-app cleanup completed. Remaining buttons: ${remainingButtons.length}`);
    }
    
    // Immediate cleanup on script load (before DOMContentLoaded)
    globalButtonCleanup();
    
    // Device detection
    const isMobile = window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    document.addEventListener('DOMContentLoaded', () => {
      // Always clean up first, regardless of which app will load
      globalButtonCleanup();
      
      if (isMobile) {
        console.log('📱 Loading Mobile App...');
        import('./src/AppMobile.js').then(module => {
          new module.App();
        });
      } else {
        console.log('🖥️ Loading Desktop App...');
        import('./src/App.js').then(module => {
          new module.App();
        });
      }
    });
  </script>
