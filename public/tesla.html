<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Coil Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>::-webkit-scrollbar { display: none;}</style>
</head>
<body class="bg-[#2C2C2C] overflow-hidden">
    <div id="tesla-container" class="relative w-full h-[900px] flex items-center justify-center">
        <canvas id="tesla-canvas" class="absolute inset-0 w-full h-full"></canvas>
        
        <div id="coil-base" class="relative z-10 flex flex-col items-center">
            <div class="w-3 h-32 bg-gradient-to-b from-gray-400 to-gray-600 rounded-t-full shadow-lg"></div>
            <div class="w-16 h-3 bg-gradient-to-r from-gray-500 via-gray-400 to-gray-500 rounded-full"></div>
            <div class="w-20 h-4 bg-gradient-to-r from-gray-600 via-gray-500 to-gray-600 rounded-full mt-1"></div>
            <div class="w-24 h-6 bg-gradient-to-b from-gray-700 to-gray-800 rounded-b-lg shadow-xl"></div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const canvas = document.getElementById('tesla-canvas');
            const ctx = canvas.getContext('2d');
            const coilBase = document.getElementById('coil-base');
            
            canvas.width = window.innerWidth;
            canvas.height = 900;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            class ConcentricWave {
                constructor() {
                    this.radius = 0;
                    this.maxRadius = 400;
                    this.speed = 2 + Math.random() * 2;
                    this.color = Math.random() > 0.5 ? '#FFFFFF' : '#FF0000';
                }
                
                update() {
                    this.radius += this.speed;
                    if (this.radius > this.maxRadius) {
                        this.radius = 0;
                    }
                }
                
                draw() {
                    const alpha = 1 - (this.radius / this.maxRadius);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY - 80, this.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = alpha * 0.4;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
            }
            
            class CircuitLine {
                constructor() {
                    this.angle = Math.random() * Math.PI * 2;
                    this.distance = 200 + Math.random() * 300;
                    this.x = centerX + Math.cos(this.angle) * this.distance;
                    this.y = centerY - 80 + Math.sin(this.angle) * this.distance;
                    this.length = 30 + Math.random() * 80;
                    this.direction = Math.random() * Math.PI * 2;
                    this.nodes = [];
                    this.generateNodes();
                    this.pulseOffset = Math.random() * Math.PI * 2;
                }
                
                generateNodes() {
                    let currentX = this.x;
                    let currentY = this.y;
                    const segments = 3 + Math.floor(Math.random() * 5);
                    
                    for (let i = 0; i < segments; i++) {
                        const segmentLength = 20 + Math.random() * 40;
                        const angle = this.direction + (Math.random() - 0.5) * Math.PI / 4;
                        const nextX = currentX + Math.cos(angle) * segmentLength;
                        const nextY = currentY + Math.sin(angle) * segmentLength;
                        
                        this.nodes.push({
                            x1: currentX,
                            y1: currentY,
                            x2: nextX,
                            y2: nextY,
                            hasNode: Math.random() > 0.6
                        });
                        
                        currentX = nextX;
                        currentY = nextY;
                        this.direction = angle;
                    }
                }
                
                draw(time) {
                    const pulse = Math.sin(time * 0.003 + this.pulseOffset) * 0.5 + 0.5;
                    
                    this.nodes.forEach((node, index) => {
                        ctx.beginPath();
                        ctx.moveTo(node.x1, node.y1);
                        ctx.lineTo(node.x2, node.y2);
                        ctx.strokeStyle = '#FF0000';
                        ctx.globalAlpha = 0.3 + pulse * 0.3;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                        
                        if (node.hasNode) {
                            ctx.beginPath();
                            ctx.arc(node.x2, node.y2, 3, 0, Math.PI * 2);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.globalAlpha = 0.6 + pulse * 0.4;
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = '#FFFFFF';
                            ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    });
                    
                    ctx.globalAlpha = 1;
                }
            }
            
            class LightningBolt {
                constructor() {
                    this.reset();
                }
                
                reset() {
                    this.startX = centerX;
                    this.startY = centerY - 80;
                    this.angle = Math.random() * Math.PI * 2;
                    this.distance = 150 + Math.random() * 250;
                    this.endX = this.startX + Math.cos(this.angle) * this.distance;
                    this.endY = this.startY + Math.sin(this.angle) * this.distance;
                    this.segments = [];
                    this.lifetime = 0;
                    this.maxLifetime = 8 + Math.floor(Math.random() * 15);
                    this.color = Math.random() > 0.3 ? '#FFFFFF' : '#FF0000';
                    this.thickness = 1 + Math.random() * 2;
                    this.generateSegments();
                }
                
                generateSegments() {
                    this.segments = [];
                    let currentX = this.startX;
                    let currentY = this.startY;
                    const steps = 20 + Math.floor(Math.random() * 30);
                    
                    for (let i = 0; i < steps; i++) {
                        const progress = i / steps;
                        const targetX = this.startX + (this.endX - this.startX) * progress;
                        const targetY = this.startY + (this.endY - this.startY) * progress;
                        
                        const offsetX = (Math.random() - 0.5) * 30;
                        const offsetY = (Math.random() - 0.5) * 30;
                        
                        const nextX = targetX + offsetX;
                        const nextY = targetY + offsetY;
                        
                        this.segments.push({
                            x1: currentX,
                            y1: currentY,
                            x2: nextX,
                            y2: nextY
                        });
                        
                        if (Math.random() > 0.85) {
                            const branchAngle = this.angle + (Math.random() - 0.5) * Math.PI / 2;
                            const branchLength = 30 + Math.random() * 60;
                            const branchEndX = nextX + Math.cos(branchAngle) * branchLength;
                            const branchEndY = nextY + Math.sin(branchAngle) * branchLength;
                            
                            this.segments.push({
                                x1: nextX,
                                y1: nextY,
                                x2: branchEndX,
                                y2: branchEndY,
                                branch: true
                            });
                        }
                        
                        currentX = nextX;
                        currentY = nextY;
                    }
                }
                
                update() {
                    this.lifetime++;
                    if (this.lifetime >= this.maxLifetime) {
                        this.reset();
                    }
                }
                
                draw() {
                    const alpha = 1 - (this.lifetime / this.maxLifetime);
                    
                    this.segments.forEach(segment => {
                        ctx.beginPath();
                        ctx.moveTo(segment.x1, segment.y1);
                        ctx.lineTo(segment.x2, segment.y2);
                        
                        const glow = segment.branch ? this.thickness * 2 : this.thickness * 3;
                        ctx.shadowBlur = glow * 8;
                        ctx.shadowColor = this.color;
                        ctx.strokeStyle = this.color;
                        ctx.globalAlpha = alpha * (segment.branch ? 0.5 : 0.8);
                        ctx.lineWidth = segment.branch ? this.thickness * 0.5 : this.thickness;
                        ctx.stroke();
                    });
                    
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
            }
            
            const concentricWaves = [];
            for (let i = 0; i < 6; i++) {
                const wave = new ConcentricWave();
                wave.radius = (i / 6) * wave.maxRadius;
                concentricWaves.push(wave);
            }
            
            const circuitLines = [];
            for (let i = 0; i < 20; i++) {
                circuitLines.push(new CircuitLine());
            }
            
            const bolts = [];
            for (let i = 0; i < 12; i++) {
                bolts.push(new LightningBolt());
            }
            
            function drawCoilGlow() {
                const gradient = ctx.createRadialGradient(centerX, centerY - 80, 10, centerX, centerY - 80, 100);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                gradient.addColorStop(0.3, 'rgba(255, 0, 0, 0.2)');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY - 80, 100, 0, Math.PI * 2);
                ctx.fill();
            }
            
            let time = 0;
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                time++;
                
                circuitLines.forEach(line => line.draw(time));
                
                concentricWaves.forEach(wave => {
                    wave.update();
                    wave.draw();
                });
                
                drawCoilGlow();
                
                bolts.forEach(bolt => {
                    bolt.update();
                    bolt.draw();
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
            
            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = 900;
            });
        });
    </script>
</body>
</html>
